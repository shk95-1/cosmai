[project]
name = "cosmai"
version = "0.0.1"
description = "화장품 소비자 니즈 분석 시스템 — 수집·정규화·분석 모노레포"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pydantic>=2",
    # collectors/commerce (#7): oliveyoung's ranking/detail pages are HTML, parsed offline against
    # saved fixtures -- selectolax brings no network dependency with it.
    "selectolax>=0.3,<1",
    "anthropic>=1.0",
    # collectors/commerce's live transport (#10). Two, because one source is not reachable over
    # plain HTTP: oliveyoung answers it with a Cloudflare challenge, so its ranking is rendered by a
    # real Chromium while its POST-only review API still goes out over httpx.
    "httpx>=0.28,<1",
    "playwright>=1.47",
]

[project.scripts]
cosmai = "cosmai.cli:main"

# 콘솔 스크립트를 실제로 깔려면 프로젝트가 패키지여야 한다. 평평한 레이아웃 그대로 네 모듈만 담고,
# uv sync 는 editable 로 넣으므로 작업 트리가 계속 정본이다 (python -m cosmai.cli 도 그대로 돈다).
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["cosmai", "analysis", "collectors", "db"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "basedpyright>=1.29",
]
# analysis/retrieval (#28): 성분명·담론어를 한 토큰으로 유지하려면 사용자 사전을 얹은 형태소
# 분석기가 필요하다 -- 공백 토큰화로는 `에칠헥실트리아존` 이 쪼개져 성분 검색이 조용히 빈다.
# numpy 는 벡터 파일(.npy)을 읽고 코사인을 계산하는 데 직접 쓴다 -- kiwipiepy 가 딸려 오게
# 두면 그쪽이 의존을 끊는 날 조용히 사라진다.
retrieval = [
    "kiwipiepy>=0.20",
    "numpy>=2",
]
# 벡터를 만드는 쪽만. torch 가 딸려 오므로 이미지에도 tool/checks/test 에도 넣지 않는다 --
# 인코딩은 GPU 가 있는 호스트에서 사람이 돌리는 일이고, 크론이 하는 일이 아니다 (#28).
embed = [
    "sentence-transformers>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # `db` and friends are plain packages in the repo root, not installed.
addopts = "-q -m 'not live and not local_llm' --strict-markers"
markers = [
    "live: touches the real network; excluded by default",
    "postgres: needs the real roles from db/bootstrap.sql (tool/checks/test provides them)",
    "local_llm: talks to a local ollama on OLLAMA_URL; free and offline-ish but excluded by default",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["playbook"]
# 확장자 없는 실행 파일은 기본 수집에 안 걸린다. `tool/` 의 파이썬 도구는 이름으로 들여보낸다 --
# 안 그러면 훅의 format·lint 가 그 파일 앞에서 조용히 아무 말도 하지 않는다 (포크 #41).
extend-include = [
    "tool/compare-ydc-sensitivity",
    "tool/measure-query-routing",
    "tool/measure-vector-floor",
    "tool/show-vector-stamp",
    "tool/show-lexicon-stamp",
    "tool/compare-ydc-crosscheck",
    "tool/compare-ydc-holdout",
    "tool/measure-crosscheck-keys",
    "tool/measure-lexicon-candidates",
    "tool/measure-evidence-fixture",
    "tool/measure-source-mix",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# One line is over 110 columns because it is a Korean report string held under `# fmt: off` --
# reflowing it would re-stage a Korean line and trip tool/checks/lang for no behaviour change.
[tool.ruff.lint.per-file-ignores]
"tool/measure-source-mix" = ["E501"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["tests", "analysis", "collectors", "db"]
exclude = ["playbook"]
