[project]
name = "cosmai"
version = "0.0.1"
description = "화장품 소비자 니즈 분석 시스템 — 수집·정규화·분석 모노레포"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pydantic>=2",
    # collectors/commerce (#7): oliveyoung's ranking/detail pages are HTML, parsed offline against
    # saved fixtures -- selectolax brings no network dependency with it.
    "selectolax>=0.3,<1",
    "anthropic>=1.0",
    # collectors/commerce's live transport (#10). Two, because one source is not reachable over
    # plain HTTP: oliveyoung answers it with a Cloudflare challenge, so its ranking is rendered by a
    # real Chromium while its POST-only review API still goes out over httpx.
    "httpx>=0.28,<1",
    "playwright>=1.47",
]

[project.scripts]
cosmai = "cosmai.cli:main"

# 콘솔 스크립트를 실제로 깔려면 프로젝트가 패키지여야 한다. 평평한 레이아웃 그대로 네 모듈만 담고,
# uv sync 는 editable 로 넣으므로 작업 트리가 계속 정본이다 (python -m cosmai.cli 도 그대로 돈다).
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["cosmai", "analysis", "collectors", "db"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "basedpyright>=1.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # `db` and friends are plain packages in the repo root, not installed.
addopts = "-q -m 'not live and not local_llm' --strict-markers"
markers = [
    "live: touches the real network; excluded by default",
    "postgres: needs the real roles from db/bootstrap.sql (tool/checks/test provides them)",
    "local_llm: talks to a local ollama on OLLAMA_URL; free and offline-ish but excluded by default",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["analysis/slices", "playbook"]  # 참조용 원본: 이식 시 패키지로 옮기며 검사 대상이 된다

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["tests", "analysis", "collectors", "db"]
exclude = ["analysis/slices", "playbook"]
