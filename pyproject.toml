[project]
name = "cosmai"
version = "0.0.1"
description = "Cosmetics consumer needs analysis system — a collection, normalization and analysis monorepo"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pydantic>=2",
    # collectors/commerce (#7): oliveyoung's ranking/detail pages are HTML, parsed offline against
    # saved fixtures -- selectolax brings no network dependency with it.
    "selectolax>=0.3,<1",
    "anthropic>=1.0",
    # collectors/commerce's live transport (#10). Two, because one source is not reachable over
    # plain HTTP: oliveyoung answers it with a Cloudflare challenge, so its ranking is rendered by a
    # real Chromium while its POST-only review API still goes out over httpx.
    "httpx>=0.28,<1",
    "playwright>=1.47",
]

[project.scripts]
cosmai = "cosmai.cli:main"

# Installing the console script for real needs the project to be a package. It keeps the flat layout and
# holds just the four modules, and uv sync installs it editable, so the working tree stays canonical
# (python -m cosmai.cli still runs as it did).
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["cosmai", "analysis", "collectors", "db"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "basedpyright>=1.29",
]
# analysis/retrieval (#28): 성분명·담론어를 한 토큰으로 유지하려면 사용자 사전을 얹은 형태소
# 분석기가 필요하다 -- 공백 토큰화로는 `에칠헥실트리아존` 이 쪼개져 성분 검색이 조용히 빈다.
# numpy is used directly to read the vector files (.npy) and compute cosines -- left to arrive with
# kiwipiepy, it disappears quietly the day that side drops the dependency.
retrieval = [
    "kiwipiepy>=0.20",
    "numpy>=2",
]
# Only the side that makes vectors. torch comes with it, so it goes into neither the image nor
# tool/checks/test -- encoding is something a person runs on a host with a GPU, not something cron does (#28).
embed = [
    "sentence-transformers>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # `db` and friends are plain packages in the repo root, not installed.
addopts = "-q -m 'not live and not local_llm' --strict-markers"
markers = [
    "live: touches the real network; excluded by default",
    "postgres: needs the real roles from db/bootstrap.sql (tool/checks/test provides them)",
    "local_llm: talks to a local ollama on OLLAMA_URL; free and offline-ish but excluded by default",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["playbook"]
# An extension-less executable is not picked up by the default collection. The python tools in `tool/`
# are let in by name -- otherwise the hook's format·lint say nothing at all in front of those files (fork #41).
extend-include = [
    "tool/compare-ydc-sensitivity",
    "tool/measure-query-routing",
    "tool/measure-vector-floor",
    "tool/show-vector-stamp",
    "tool/show-lexicon-stamp",
    "tool/compare-ydc-crosscheck",
    "tool/compare-ydc-holdout",
    "tool/measure-crosscheck-keys",
    "tool/measure-lexicon-candidates",
    "tool/measure-evidence-fixture",
    "tool/measure-source-mix",
    "tool/measure-transcript-bimodal",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["tests", "analysis", "collectors", "db"]
exclude = ["playbook"]
