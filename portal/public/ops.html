<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>파이프라인 관제</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>파이프라인 관제</h1>
  <div id="ops-caption" class="caption">불러오는 중…</div>
  <p id="error" class="error" role="alert"></p>
  <p class="caption"><a href="index.html">← 니즈 지표</a> · <a href="map.html">파이프라인 구조 →</a></p>
</header>

<!-- Most mornings should end with looking at only this and closing the tab. The spot where the answer shows with no scrolling. -->
<section id="ops-banner" class="screen"></section>

<!-- If there are no problems, this whole section disappears — no empty table is left behind. -->
<section id="ops-problems" class="screen"></section>

<section id="ops-arms" class="screen"></section>

<!-- Declared not to run. Disappearing from the list and quietly not running are different things. -->
<section id="ops-disabled" class="screen"></section>

<footer class="caption">
  <button type="button" id="ops-refresh">새로고침</button>
  <span id="ops-fetched"></span>
</footer>

<script type="module" src="ops-app.js"></script>
</body>
</html>
