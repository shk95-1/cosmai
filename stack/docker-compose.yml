# This repo's compose -- every bit of wiring lives in this one file (README.md's "stack/" section). #10
# §C procedure 1 adds the collection/analysis schedulers to what used to be a portal-only file.
#
# **db-net and the database belong to this file now (#177).** Both were the `shared-db` project's:
# it created the network, fixed its unprefixed name, and ran shared-postgres. That project died
# with the old fleet on 2026-08-28 and its compose file is gone (#176), so nothing else declares
# either any more. db-net is therefore declared below without `external: true`, which is what lets
# `up` succeed on a host where the network does not exist; the `postgres` service opens the
# cluster the dead container left on disk rather than making a new one.
#
# **`up` on the current host changes no attachment.** The live db-net carries
# `com.docker.compose.network=db-net`, and that label -- not the project label -- is the only one
# compose hard-checks, so the existing network is adopted with a warning ("a network with name
# db-net exists but was not created for project cosmai") and nothing is detached, recreated or
# reconnected by hand. The five old-stack containers on it, PostgREST above all (the portal calls
# it from the browser until #179), stay where they are.
#
# **The hazard is `down`.** Compose refuses to remove a network carrying another project's label,
# so today `down` here cannot touch db-net. The day db-net is ever removed and recreated by THIS
# project it carries `project=cosmai`, and `down` will then try to delete the network those old
# containers are still sitting on. Until #181 retires them, stop and start this stack with
# `stop`/`up` -- never `down`.
#
# **One scheduler is one crontab per container.** supercronic has no per-line switch, so a container is
# the smallest unit an operator can turn on and off. So this splits apart whatever must be stopped
# separately: each arm that spends an outside request budget (commerce, naver, youtube work) on its
# own, each arm that does not spend that budget (youtube flatten+prune, analyze) on its own, and youtube
# watch alone, since #10 procedure 3 says to turn it on only after the queue depth is checked. The name
# says which file belongs to which container (stack/crontab.d/<service name>) --
# tests/stack/test_stack_wiring.py checks that mapping along with the values below.
#
# **The build is what satisfies condition 2's "confirm it works inside the image".** The last RUN in
# stack/Dockerfile runs `cosmai --help`, `db/migrate.sh --help`, `ls contracts/ddl/needs/*.sql`, and a
# `scope_threshold()` import through site-packages, all inside the image. That build succeeding is that
# condition's evidence.
name: cosmai

# **Running `up -d` today makes two collectors fail on every run.** collectors/{naver,youtube}/cli.py's
# default fetcher is still `_RaisingFetcher`, so collector-youtube-work ends with NotImplementedError
# 288 times a day and collector-naver twice a month, and not a single outside request ever leaves either
# of them. Still not hidden behind a profile, because: what procedure 1 checks is the wiring, and gating
# it would keep `up -d` from ever raising that wiring, leaving nothing to check against. The cost is only
# log noise too -- supercronic keeps running after a job fails, so the container never enters a restart
# loop.
#
# **collector-commerce is no longer part of that set.** #10 attached a live transport
# (`fetcher or live_fetchers()` in collectors/commerce/cli.py), so this container sends real requests to
# the four commerce sites at the very next cron time, the moment it starts. Since STATE.md §3 forbids
# new collection before cutover and condition 3 (shadow run) is a stage a person opens by choosing a
# time, this **sits behind the `commerce` profile** so a file enforces that ban rather than convention --
# a deploy must never turn itself into the shadow run. The command that opens it is written in that
# service's own block, and tests/stack/test_live_collection_is_behind_a_profile.py checks that it never
# starts without the profile.
# (collector-youtube-watch also sits behind a profile, but for a different reason -- queue depth. See
# below.)
#
# The definition six schedulers share. It is one object for the same reason as the fleet's own anchor:
# if these values ever diverged, one container alone would quietly point at a different DB (the host
# default 127.0.0.1:5434 -- an address that is nothing at all from inside a container), and that would
# not show up as a crash but as "collection runs, but the row count never grows".
x-cron: &cron
  # The image comes from exactly one place, stack/Dockerfile. Only supercronic is layered on top of it
  # by stack/Dockerfile.cron (that file's own comment explains why it is two stages). **Never run
  # `docker compose build` on its own** -- without that earlier stage, FROM picks up someone else's
  # `cosmai` already sitting on this host. tool/stack-build runs both stages in one go.
  build:
    context: ..
    dockerfile: stack/Dockerfile.cron
  image: cosmai-needs-cron:local
  # All six share this same build: the tag is the same, so every one after the first is a cache hit, and
  # in exchange the watch container hiding behind its profile can still be built and started alone, with
  # no other service.
  restart: unless-stopped
  # Now that the database lives in this same file (#177), a scheduler can start before the cluster does.
  # That first cron line then ends as a run closed by connection refused, not a crash, so nothing retries
  # it.
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    # contracts/entrypoints.md §DB 접속 노브. 망 안에서는 서비스명:5432 가 호스트의 127.0.0.1:5434 와
    # 같은 DB 다 — db/runtime.py 의 host_and_port() 가 세 자리에서 이 둘만 읽는다.
    COSMAI_DB_HOST: postgres
    COSMAI_DB_PORT: "5432"
    # db/secrets.py's COSMAI_SECRET_FILE. A location, not a value.
    COSMAI_SECRET_FILE: /run/cosmai/env
    # supercronic streams each job's stdout straight through, so if it were ever buffered, `docker logs`
    # would sit empty while the job runs and fill all at once when it exits.
    PYTHONUNBUFFERED: "1"
    # stack/crontab.d/* 여섯 파일이 전부 첫 줄에서 UTC 라고 선언하고 contracts/entrypoints.md §스케줄
    # 의 시각도 UTC 다. 이 줄이 없으면 그것이 베이스 이미지가 마침 UTC 라는 우연이고, 이미지를 바꾸는
    # 날 여섯 스케줄이 한꺼번에 움직인다.
    TZ: UTC
  volumes:
    # Read-only: no scheduler ever writes to this file. The host path is a variable, not a literal, and
    # has no default -- leaving it out makes compose refuse to start, naming it (stack/env.example).
    - ${COSMAI_SECRET_FILE_HOST:?stack-env-example 참고 - ~/.config/cosmai/env 의 호스트 절대경로}:/run/cosmai/env:ro
  networks:
    - db-net

services:
  # --- Database -----------------------------------------------------------------------------------
  # #177: the cluster every other service here reads and writes. No POSTGRES_USER/PASSWORD/DB is
  # set, and none may be: the data directory below already holds an initialised cluster, so the
  # entrypoint sets DATABASE_ALREADY_EXISTS and never reaches docker_verify_minimum_env -- the one
  # place those variables are required (docker-entrypoint.sh, `if [ -z "$DATABASE_ALREADY_EXISTS" ]`
  # in _main). initdb does not run again, the roles and their passwords are already in the cluster,
  # and no secret value enters this file or stack/.env (contracts/secrets.md).
  postgres:
    image: postgres:18
    # The exact image that wrote the cluster on disk. A different major version refuses to start on top
    # of this data directory.
    container_name: cosmai-postgres
    restart: unless-stopped
    volumes:
      # This mounts PGDATA's parent -- the dead container mounted it the same way, and the image's
      # PGDATA default, /var/lib/postgresql/18/docker, sits right under it unchanged. Mounting the
      # child directly would fail to find the same cluster and create an empty one instead.
      #
      # No default -- an absolute host path, the same kind as COSMAI_SECRET_FILE_HOST. Since this
      # file's `name: cosmai` and container_name are fixed, `up` from any checkout targets the same
      # production container, while a relative default that resolves to a different spot per checkout
      # would recreate that container on top of the wrong directory. That path only fails to start
      # after the entrypoint's docker_create_db_directories has already created it, owned by root.
      - ${COSMAI_PG_DATA_DIR:?stack/env.example - absolute host path of the existing postgres data directory}:/var/lib/postgresql
    ports:
      # The address `uv run cosmai ...` running on the host and db/migrate.sh see (db/runtime.py's
      # default). Opened only on loopback -- exactly the range the old container opened.
      - "127.0.0.1:5434:5432"
    healthcheck:
      # The condition depends_on below waits on. The moment the port opens and the moment the cluster
      # accepts queries are different (WAL replay at startup) -- a cron container that starts in
      # between just ends quietly as one failed run.
      # **This only measures being alive. It cannot measure which cluster this is** -- even on a
      # freshly created empty cluster, this command exits 0 with neither a platform role nor an app DB.
      # Green here must never be read as "the data is there". The place that asks that question is
      # tool/status's db section (ledger version, app size, row counts).
      test: ["CMD-SHELL", "pg_isready -U platform -d app"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      db-net:
        # transition alias, removed by #181: the old stack's PostgREST resolves this database as
        # `shared-postgres` on this network and the portal still calls that PostgREST from the
        # browser until #179.
        aliases:
          - shared-postgres

  # --- Collection ---------------------------------------------------------------------------------
  # 커머스 4사. 여섯 줄이 한 컨테이너인 이유는 하나의 요청 예산을 나눠 쓰기 때문이다: crontab.d 의
  # 간격 규칙(contracts/entrypoints.md §스케줄)은 이 줄들이 서로 겹치지 않는다는 전제 위에 있고,
  # 컨테이너를 쪼개면 그 전제를 지킬 자리가 없어진다.
  #
  # **Sits behind a profile, so `docker compose up -d` never starts it** -- the live transport is
  # attached, so real requests go out the moment it starts, and when the first one goes out is a time a
  # person chooses at #10 condition 3 (shadow run). The same command also turns it on permanently at
  # condition 5 (cutover).
  # This gate only blocks a bare `up -d` with no argument -- naming the service directly, either
  # `up -d collector-commerce` or `run --rm collector-commerce`, still starts it with no profile, which
  # is Compose's standard behavior (naming a service directly auto-activates its profile);
  # collector-youtube-watch has the same limit as an existing pattern, so this is not a regression.
  # This must never be read as "collection can never start by accident".
  # Turn on: docker compose --profile commerce up -d collector-commerce
  # Turn off: docker compose stop collector-commerce
  # (stack/rollback.sh already calls this with the profile on -- otherwise a rollback could not stop
  # this container.)
  collector-commerce:
    <<: *cron
    command: ["supercronic", "/srv/cosmai/stack/crontab.d/collector-commerce"]
    profiles: ["commerce"]
    # #27 round 2: the bind-mounted profile below is host uid 1000 (user1's), and stack/Dockerfile
    # declares no USER -- every *cron container is root by default. Root can write it regardless of
    # ownership, but the files it creates then belong to root, and the next host-side `uv run cosmai
    # login` (uid 1000, not root) cannot touch them. Pinning only this service to the host's uid/gid
    # keeps every other *cron service on the anchor's root default -- they only touch named volumes
    # (youtube-payloads), where no host-owned file is ever read back by a non-root process.
    user: "1000:1000"
    environment:
      # `<<:` replaces the anchor's environment: wholesale too (the same trap volumes: has below),
      # so every key the anchor set has to be repeated -- dropping one here is silent until whichever
      # knob it was turns out unset at 03:00.
      COSMAI_DB_HOST: postgres
      COSMAI_DB_PORT: "5432"
      COSMAI_SECRET_FILE: /run/cosmai/env
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      # uid 1000 has no /etc/passwd entry in this image (no useradd ran for it), so Chromium's
      # search for a home directory fails unless $HOME is set directly -- and it needs one writable,
      # for its own cache/config dirs beside the profile's user_data_dir. /tmp is world-writable
      # (sticky bit) in the trixie-slim base by default.
      HOME: /tmp
    volumes:
      # `<<:` replaces the anchor's volumes: rather than adding to them (collector-youtube-work/
      # -flatten below hit the same trap), so the secret mount has to be repeated here.
      - ${COSMAI_SECRET_FILE_HOST:?stack-env-example 참고 - ~/.config/cosmai/env 의 호스트 절대경로}:/run/cosmai/env:ro
      # #27: a bind mount, not a named volume -- a person authorises this by hand from the HOST with
      # `uv run cosmai login --source <s>` (repo root), the way the old stack's
      # TREND_RADAR_PROFILE_DIR did (service/stack/docker-compose.yml:156) and for the same reason: a
      # named volume would force the login window through the container, which on WSL2 means wiring
      # up display forwarding a person does not already have. The relative default resolves against
      # this file's own directory (stack/), so `../var/browser-profiles` is the repo root's
      # `var/browser-profiles` -- the same place `collectors/commerce/transport/browser.py`'s
      # DEFAULT_PROFILE_DIR resolves to when `cosmai login`/`cosmai collect` run from the repo root
      # on the host. Read-write: oliveyoung refreshes session cookies mid-run, so read-only would
      # make every run after the first one collect against a stale session.
      - ${COMMERCE_BROWSER_PROFILE_DIR:-../var/browser-profiles}:/srv/cosmai/var/browser-profiles

  # The naver API Hub. A different host and different keys from commerce
  # (contracts/secrets.md's COSMA_SRC_NAVER_BLOG_*), so its budget is separate too -- naver's quota
  # being blocked is no reason to stop commerce.
  collector-naver:
    <<: *cron
    command: ["supercronic", "/srv/cosmai/stack/crontab.d/collector-naver"]

  # The youtube queue consumer. This stands alone because it is the only one of the three youtube lines
  # that spends an outside request: if the quota runs out, only this one stops, and watch and flatten
  # keep running.
  collector-youtube-work:
    <<: *cron
    command: ["supercronic", "/srv/cosmai/stack/crontab.d/collector-youtube-work"]
    volumes:
      - ${COSMAI_SECRET_FILE_HOST:?stack-env-example 참고 - ~/.config/cosmai/env 의 호스트 절대경로}:/run/cosmai/env:ro
      # The exact directory work writes and flatten reads. If the two ever saw different volumes, an
      # artifacts row would exist with no payload file behind it, and flatten would count nothing but
      # errors across the board (collectors/youtube/payload_store.py). The path is PayloadStore's
      # default `var/youtube-payloads` resolved against the image's WORKDIR.
      - youtube-payloads:/srv/cosmai/var/youtube-payloads

  # flatten + prune. Neither makes an outside request (one unpacks a stored payload, the other deletes
  # aged rows), so there is no reason to split them apart by budget.
  collector-youtube-flatten:
    <<: *cron
    command: ["supercronic", "/srv/cosmai/stack/crontab.d/collector-youtube-flatten"]
    volumes:
      - ${COSMAI_SECRET_FILE_HOST:?stack-env-example 참고 - ~/.config/cosmai/env 의 호스트 절대경로}:/run/cosmai/env:ro
      - youtube-payloads:/srv/cosmai/var/youtube-payloads

  # The fan-out's source. **Sits behind a profile, so `docker compose up -d` never starts it** -- this
  # is the line #10 procedure 3 says to turn on only after confirming queue depth < MAX_QUEUE_DEPTH, and
  # it must stay off until that check happens.
  # Turn on: docker compose --profile youtube-watch up -d collector-youtube-watch
  # Turn off: docker compose stop collector-youtube-watch
  # (Today collectors/youtube/watchlist.txt is a placeholder with no directives, so turning this on
  #  rejects with exit code 2 every hour. Filling in that list is a precondition for turning it on --
  #  the list lives inside the image, so this needs a rebuild.)
  collector-youtube-watch:
    <<: *cron
    command: ["supercronic", "/srv/cosmai/stack/crontab.d/collector-youtube-watch"]
    profiles: ["youtube-watch"]

  # --- Analysis -------------------------------------------------------------------------------------
  # DB-only, so it belongs to no collection budget. This gets its own container so analysis can keep
  # running over rows already collected even while a collector is stopped for a rollback.
  analyze:
    <<: *cron
    command: ["supercronic", "/srv/cosmai/stack/crontab.d/analyze"]
    environment:
      # `<<:` replaces environment: wholesale, so the anchor's five keys are repeated here too --
      # collector-commerce has already hit this trap, and dropping one only surfaces at 08:00.
      COSMAI_DB_HOST: postgres
      COSMAI_DB_PORT: "5432"
      COSMAI_SECRET_FILE: /run/cosmai/env
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      # The host ollama the 08:00 line's gemma4 calls (#32). This is an address knob, not a secret, so
      # the value can live here (stack/env.example, "what is not a secret" in contracts/secrets.md).
      # The default is the only path measured to round-trip inside a container: the Windows Tailscale
      # interface WSL2's mirroring inherits -- neither the bridge gateway (172.18.0.1), the LAN
      # (192.168.10.35), nor host.docker.internal were reachable.
      # **This address disappears when Tailscale is off** -- swap it out from stack/.env when that
      # happens. An unreachable night is not a quiet zero but a failed run
      # (the preflight in analysis/polarity/ollama.py).
      OLLAMA_URL: ${OLLAMA_URL:-http://100.102.193.98:11434}

  # --- Exposure -------------------------------------------------------------------------------------
  # No backend, no DB credential: the browser calls PostgREST (3000) directly, so this container only
  # serves static files (portal/Dockerfile's own comment).
  portal:
    build: ../portal
    image: cosmai-portal
    restart: unless-stopped
    # Only serves static files, but the DB behind the API it calls is this one -- it starts in the same
    # order as the schedulers.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # The same exposure range as PostgREST (the local network) -- what it shows is only data that
      # API already opened to anon, so this creates no new exposure.
      - "${NEEDS_PORTAL_PORT:-3003}:80"
    networks:
      - db-net

volumes:
  # A named volume: this file does not fix where it lives on the host. What is inside is only
  # reacquirable payload, so it is not something to back up, and its pairing with an artifacts row is
  # held by the digest on the DB side.
  youtube-payloads:

networks:
  db-net:
    # An unprefixed name. The old-stack containers still attached to this network look it up by this
    # name, and this same name is also the basis (com.docker.compose.network) compose uses to adopt an
    # existing network instead of creating a new one.
    # Not external -- since the project that used to create it is gone (#176), external would only make
    # `up` fail on a host with no such network. The hazard that trades for in `down` is written in this
    # file's header.
    name: db-net
