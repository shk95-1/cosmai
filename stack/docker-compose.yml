# 이 레포의 compose — 배선 전부는 여기 하나(README.md "stack/" 절). portal 하나였던 파일에 #10 §C
# 절차 1 이 수집·분석 스케줄러를 더한다.
#
# **db-net and the database belong to this file now (#177).** Both were the `shared-db` project's:
# it created the network, fixed its unprefixed name, and ran shared-postgres. That project died
# with the old fleet on 2026-08-28 and its compose file is gone (#176), so nothing else declares
# either any more. db-net is therefore declared below without `external: true`, which is what lets
# `up` succeed on a host where the network does not exist; the `postgres` service opens the
# cluster the dead container left on disk rather than making a new one.
#
# **`up` on the current host changes no attachment.** The live db-net carries
# `com.docker.compose.network=db-net`, and that label -- not the project label -- is the only one
# compose hard-checks, so the existing network is adopted with a warning ("a network with name
# db-net exists but was not created for project cosmai") and nothing is detached, recreated or
# reconnected by hand. The five old-stack containers on it, PostgREST above all (the portal calls
# it from the browser until #179), stay where they are.
#
# **The hazard is `down`.** Compose refuses to remove a network carrying another project's label,
# so today `down` here cannot touch db-net. The day db-net is ever removed and recreated by THIS
# project it carries `project=cosmai`, and `down` will then try to delete the network those old
# containers are still sitting on. Until #181 retires them, stop and start this stack with
# `stop`/`up` -- never `down`.
#
# **스케줄러는 컨테이너당 크론탭 하나.** supercronic 에는 줄 단위 스위치가 없어서 운영자가 켜고 끌 수
# 있는 최소 단위가 컨테이너다. 그래서 따로 멈춰야 하는 것끼리 나눈다: 외부 요청 예산을 쓰는 팔
# (commerce · naver · youtube work)이 각각, 그 예산을 안 쓰는 팔(youtube flatten+prune · analyze)이
# 각각, 그리고 #10 절차 3 이 큐 깊이를 확인한 뒤에야 켜라고 한 youtube watch 가 혼자. 어느 파일이 어느
# 컨테이너 것인지는 이름이 말한다(stack/crontab.d/<서비스명>) — tests/stack/test_stack_wiring.py 가
# 그 대응과 아래 값들을 검사한다.
#
# **조건 2 의 "이미지 안 동작 확인" 은 빌드가 한다.** stack/Dockerfile 의 마지막 RUN 이 이미지 안에서
# `cosmai --help` · `db/migrate.sh --help` · `ls contracts/ddl/needs/*.sql` · site-packages 를 통한
# `scope_threshold()` 임포트를 전부 실행한다. 그 빌드가 성공했다는 것이 그 조건의 근거다.
name: cosmai

# **오늘 `up -d` 하면 수집기 둘은 매 실행 실패한다.** collectors/{naver,youtube}/cli.py 의 기본
# fetcher 는 아직 `_RaisingFetcher` 라 collector-youtube-work 는 하루 288회, collector-naver 는 월
# 2회 NotImplementedError 로 끝나고 그 둘에서 나가는 외부 요청은 한 건도 없다. 그래도 프로필 뒤로
# 숨기지 않는 이유: 절차 1 이 검사하는 것이 배선이고, 게이트를 걸면 `up -d` 가 그 배선을 띄우지 않아
# 대조할 것이 없어진다. 비용도 로그뿐이다 — supercronic 은 작업이 실패해도 계속 돌므로 컨테이너는
# 재시작 루프에 들지 않는다.
#
# **collector-commerce 는 더 이상 그 셋에 없다.** #10 이 라이브 트랜스포트를 붙였고
# (collectors/commerce/cli.py 의 `fetcher or live_fetchers()`), 그래서 이 컨테이너는 뜨는 순간부터
# 다음 크론 시각에 커머스 4사로 진짜 요청을 낸다. STATE.md §3 이 컷오버 전 새 수집을 금지하고 조건
# 3(그림자 실행)은 사람이 시각을 골라 여는 단계이므로, 그 금지를 관례가 아니라 파일이 지키도록
# **프로필 `commerce` 뒤에 둔다** — 배포가 곧 그림자 실행이 되면 안 된다. 여는 명령은 그 서비스
# 블록에 적혀 있고, tests/stack/test_live_collection_is_behind_a_profile.py 가 프로필 없이는 뜨지
# 않는다는 것을 검사한다.
# (collector-youtube-watch 도 프로필 뒤이지만 이유는 다르다 — 큐 깊이다. 아래 참조.)
#
# 스케줄러 여섯이 공유하는 정의. 하나의 객체인 이유는 fleet 쪽 앵커와 같다: 이 값들이 서로 달라지면
# 컨테이너 하나만 조용히 다른 DB(호스트 기본값 127.0.0.1:5434 — 컨테이너 안에서는 아무것도 없는 주소)를
# 보게 되고, 그것은 크래시가 아니라 "수집은 도는데 행이 안 늘어난다"로 나타난다.
x-cron: &cron
  # 이미지는 stack/Dockerfile 하나에서 나온다. supercronic 만 stack/Dockerfile.cron 이 그 위에 얹는다
  # (그 파일의 주석이 왜 두 장인지 설명한다). **`docker compose build` 만 따로 돌리지 마라** —
  # 그 앞 단계가 없으면 FROM 이 이 호스트에 이미 있는 남의 `cosmai` 를 집는다. 두 단계는
  # tool/stack-build 가 한 번에 돈다.
  build:
    context: ..
    dockerfile: stack/Dockerfile.cron
  image: cosmai-needs-cron:local
  # 여섯 다 같은 build 를 들고 있다: 태그가 같아 두 번째부터는 캐시 히트이고, 대신 프로필 뒤에 숨은
  # watch 컨테이너도 다른 서비스 없이 혼자 빌드하고 띄울 수 있다.
  restart: unless-stopped
  # 데이터베이스가 같은 파일에 있게 되면서(#177) 스케줄러가 클러스터보다 먼저 뜰 수 있다. 그때의
  # 첫 크론 줄은 크래시가 아니라 연결 거절로 끝난 run 이라 아무것도 재시도하지 않는다.
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    # contracts/entrypoints.md §DB 접속 노브. 망 안에서는 서비스명:5432 가 호스트의 127.0.0.1:5434 와
    # 같은 DB 다 — db/runtime.py 의 host_and_port() 가 세 자리에서 이 둘만 읽는다.
    COSMAI_DB_HOST: postgres
    COSMAI_DB_PORT: "5432"
    # db/secrets.py 의 COSMAI_SECRET_FILE. 값이 아니라 위치다.
    COSMAI_SECRET_FILE: /run/cosmai/env
    # supercronic 이 각 작업의 stdout 을 그대로 흘리므로, 버퍼링되면 `docker logs` 가 실행 중에는
    # 비어 있다가 종료할 때 한꺼번에 찬다.
    PYTHONUNBUFFERED: "1"
    # stack/crontab.d/* 여섯 파일이 전부 첫 줄에서 UTC 라고 선언하고 contracts/entrypoints.md §스케줄
    # 의 시각도 UTC 다. 이 줄이 없으면 그것이 베이스 이미지가 마침 UTC 라는 우연이고, 이미지를 바꾸는
    # 날 여섯 스케줄이 한꺼번에 움직인다.
    TZ: UTC
  volumes:
    # 읽기 전용: 어느 스케줄러도 이 파일에 쓰지 않는다. 호스트 경로는 리터럴이 아니라 변수이고 기본값이
    # 없다 — 빠지면 compose 가 이름을 말하며 거부한다(stack/env.example).
    - ${COSMAI_SECRET_FILE_HOST:?stack-env-example 참고 - ~/.config/cosmai/env 의 호스트 절대경로}:/run/cosmai/env:ro
  networks:
    - db-net

services:
  # --- 데이터베이스 -------------------------------------------------------------------------------
  # #177: the cluster every other service here reads and writes. No POSTGRES_USER/PASSWORD/DB is
  # set, and none may be: the data directory below already holds an initialised cluster, so the
  # entrypoint sets DATABASE_ALREADY_EXISTS and never reaches docker_verify_minimum_env -- the one
  # place those variables are required (docker-entrypoint.sh, `if [ -z "$DATABASE_ALREADY_EXISTS" ]`
  # in _main). initdb does not run again, the roles and their passwords are already in the cluster,
  # and no secret value enters this file or stack/.env (contracts/secrets.md).
  postgres:
    image: postgres:18
    # 디스크의 클러스터를 쓴 그 이미지다. 다른 메이저는 이 데이터 디렉터리 위에서 기동을 거부한다.
    container_name: cosmai-postgres
    restart: unless-stopped
    volumes:
      # PGDATA 의 부모를 붙인다 -- 죽은 컨테이너가 그렇게 붙였고, 이미지의 PGDATA 기본값
      # /var/lib/postgresql/18/docker 가 그 아래에 그대로 있다. 자식을 직접 붙이면 같은 클러스터를
      # 못 찾고 빈 것을 새로 만든다.
      #
      # 기본값이 없다 -- COSMAI_SECRET_FILE_HOST 와 같은 부류의 호스트 절대경로다. 이 파일의
      # `name: cosmai` 와 container_name 은 고정이므로 어느 체크아웃에서 `up` 하든 겨냥하는 것은
      # 같은 운영 컨테이너인데, 체크아웃마다 다른 자리로 풀리는 상대 기본값은 그 컨테이너를 엉뚱한
      # 디렉터리 위에 다시 만든다. 그 경로는 entrypoint 의 docker_create_db_directories 가 이미
      # root 소유로 만들어 놓은 뒤에야 기동이 실패한다.
      - ${COSMAI_PG_DATA_DIR:?stack/env.example - absolute host path of the existing postgres data directory}:/var/lib/postgresql
    ports:
      # 호스트에서 도는 `uv run cosmai ...` 와 db/migrate.sh 가 보는 주소(db/runtime.py 의 기본값).
      # 루프백에만 연다 -- 구 컨테이너가 열던 범위 그대로다.
      - "127.0.0.1:5434:5432"
    healthcheck:
      # 아래 depends_on 이 기다리는 조건. 포트가 열리는 시각과 클러스터가 질의를 받는 시각은 다르다
      # (기동 시 WAL 재생) -- 그 사이에 뜬 크론 컨테이너는 조용히 실패한 run 하나로 끝난다.
      # **살아 있음만 잰다. 어느 클러스터인지는 못 잰다** -- 갓 만들어진 빈 클러스터에서도 이 명령은
      # platform 롤도 app DB 도 없이 0 으로 끝난다. 초록을 "데이터가 거기 있다"로 읽으면 안 된다.
      # 그것을 되묻는 자리는 tool/status 의 db 절(원장 버전 · app 크기 · 행 수)이다.
      test: ["CMD-SHELL", "pg_isready -U platform -d app"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      db-net:
        # transition alias, removed by #181: the old stack's PostgREST resolves this database as
        # `shared-postgres` on this network and the portal still calls that PostgREST from the
        # browser until #179.
        aliases:
          - shared-postgres

  # --- 수집 ---------------------------------------------------------------------------------------
  # 커머스 4사. 여섯 줄이 한 컨테이너인 이유는 하나의 요청 예산을 나눠 쓰기 때문이다: crontab.d 의
  # 간격 규칙(contracts/entrypoints.md §스케줄)은 이 줄들이 서로 겹치지 않는다는 전제 위에 있고,
  # 컨테이너를 쪼개면 그 전제를 지킬 자리가 없어진다.
  #
  # **프로필 뒤에 있으므로 `docker compose up -d` 로는 뜨지 않는다** — 라이브 트랜스포트가 붙어 있어
  # 뜨는 순간부터 실제 요청이 나가고, 언제 처음 나갈지는 #10 조건 3(그림자 실행)에서 사람이 고르는
  # 시각이다. 조건 5(컷오버)에서 상시로 켜는 것도 같은 명령이다.
  # 이 게이트가 막는 것은 인자 없는 `up -d` 뿐이다 — 서비스명을 직접 지정한 `up -d collector-commerce`나
  # `run --rm collector-commerce`는 Compose 의 표준 동작(이름을 직접 부르면 그 서비스의 프로필이 자동
  # 활성)으로 프로필 없이도 뜬다(collector-youtube-watch 도 같은 한계를 가진 기존 패턴이라 회귀는 아님).
  # "실수로 수집이 시작되는 일은 없다"로 읽으면 안 된다.
  # 켜기: docker compose --profile commerce up -d collector-commerce
  # 끄기: docker compose stop collector-commerce
  # (stack/rollback.sh 는 이 프로필을 이미 켜고 부른다 — 안 그러면 롤백이 이 컨테이너를 못 세운다.)
  collector-commerce:
    <<: *cron
    command: ["supercronic", "/srv/cosmai/stack/crontab.d/collector-commerce"]
    profiles: ["commerce"]
    # #27 round 2: the bind-mounted profile below is host uid 1000 (user1's), and stack/Dockerfile
    # declares no USER -- every *cron container is root by default. Root can write it regardless of
    # ownership, but the files it creates then belong to root, and the next host-side `uv run cosmai
    # login` (uid 1000, not root) cannot touch them. Pinning only this service to the host's uid/gid
    # keeps every other *cron service on the anchor's root default -- they only touch named volumes
    # (youtube-payloads), where no host-owned file is ever read back by a non-root process.
    user: "1000:1000"
    environment:
      # `<<:` replaces the anchor's environment: wholesale too (the same trap volumes: has below),
      # so every key the anchor set has to be repeated -- dropping one here is silent until whichever
      # knob it was turns out unset at 03:00.
      COSMAI_DB_HOST: postgres
      COSMAI_DB_PORT: "5432"
      COSMAI_SECRET_FILE: /run/cosmai/env
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      # uid 1000 has no /etc/passwd entry in this image (no useradd ran for it), so Chromium's
      # search for a home directory fails unless $HOME is set directly -- and it needs one writable,
      # for its own cache/config dirs beside the profile's user_data_dir. /tmp is world-writable
      # (sticky bit) in the trixie-slim base by default.
      HOME: /tmp
    volumes:
      # `<<:` replaces the anchor's volumes: rather than adding to them (collector-youtube-work/
      # -flatten below hit the same trap), so the secret mount has to be repeated here.
      - ${COSMAI_SECRET_FILE_HOST:?stack-env-example 참고 - ~/.config/cosmai/env 의 호스트 절대경로}:/run/cosmai/env:ro
      # #27: a bind mount, not a named volume -- a person authorises this by hand from the HOST with
      # `uv run cosmai login --source <s>` (repo root), the way the old stack's
      # TREND_RADAR_PROFILE_DIR did (service/stack/docker-compose.yml:156) and for the same reason: a
      # named volume would force the login window through the container, which on WSL2 means wiring
      # up display forwarding a person does not already have. The relative default resolves against
      # this file's own directory (stack/), so `../var/browser-profiles` is the repo root's
      # `var/browser-profiles` -- the same place `collectors/commerce/transport/browser.py`'s
      # DEFAULT_PROFILE_DIR resolves to when `cosmai login`/`cosmai collect` run from the repo root
      # on the host. Read-write: oliveyoung refreshes session cookies mid-run, so read-only would
      # make every run after the first one collect against a stale session.
      - ${COMMERCE_BROWSER_PROFILE_DIR:-../var/browser-profiles}:/srv/cosmai/var/browser-profiles

  # 네이버 API Hub. 커머스와 다른 호스트·다른 키(contracts/secrets.md 의 COSMA_SRC_NAVER_BLOG_*)라
  # 예산도 따로다 — 네이버 쿼터가 막혔다고 커머스를 멈출 이유가 없다.
  collector-naver:
    <<: *cron
    command: ["supercronic", "/srv/cosmai/stack/crontab.d/collector-naver"]

  # youtube 큐 소비자. youtube 넷 중 외부 요청을 쓰는 유일한 줄이라 혼자 선다: 쿼터가 소진되면 이것만
  # 멈추고 watch 와 flatten 은 그대로 둔다.
  collector-youtube-work:
    <<: *cron
    command: ["supercronic", "/srv/cosmai/stack/crontab.d/collector-youtube-work"]
    volumes:
      - ${COSMAI_SECRET_FILE_HOST:?stack-env-example 참고 - ~/.config/cosmai/env 의 호스트 절대경로}:/run/cosmai/env:ro
      # work 가 쓰고 flatten 이 읽는 바로 그 디렉터리. 둘이 다른 볼륨을 보면 artifacts 행은 있는데
      # payload 파일이 없어서 flatten 이 통째로 error 를 센다 (collectors/youtube/payload_store.py).
      # 경로는 PayloadStore 의 기본값 `var/youtube-payloads` 를 이미지 WORKDIR 기준으로 편 것이다.
      - youtube-payloads:/srv/cosmai/var/youtube-payloads

  # flatten + prune. 외부 요청이 없어서(저장된 payload 를 펴고, 낡은 행을 지운다) 예산으로 갈릴 이유가
  # 없는 둘이다.
  collector-youtube-flatten:
    <<: *cron
    command: ["supercronic", "/srv/cosmai/stack/crontab.d/collector-youtube-flatten"]
    volumes:
      - ${COSMAI_SECRET_FILE_HOST:?stack-env-example 참고 - ~/.config/cosmai/env 의 호스트 절대경로}:/run/cosmai/env:ro
      - youtube-payloads:/srv/cosmai/var/youtube-payloads

  # 팬아웃의 원천. **프로필 뒤에 있으므로 `docker compose up -d` 로는 뜨지 않는다** — #10 절차 3 이
  # 큐 깊이 < MAX_QUEUE_DEPTH 를 확인한 뒤에 켜라고 한 줄이고, 그 확인 전까지 꺼져 있어야 한다.
  # 켜기: docker compose --profile youtube-watch up -d collector-youtube-watch
  # 끄기: docker compose stop collector-youtube-watch
  # (오늘 collectors/youtube/watchlist.txt 는 디렉티브가 없는 자리표시자라, 켜면 매시 종료 코드 2 로
  #  거절한다. 목록을 채우는 것이 켜기의 전제다 — 목록은 이미지 안에 있어 재빌드가 필요하다.)
  collector-youtube-watch:
    <<: *cron
    command: ["supercronic", "/srv/cosmai/stack/crontab.d/collector-youtube-watch"]
    profiles: ["youtube-watch"]

  # --- 분석 ---------------------------------------------------------------------------------------
  # DB 전용이라 어느 수집 예산에도 속하지 않는다. 수집기를 롤백으로 멈춰도 이미 쌓인 행에 대한 분석은
  # 계속 돌 수 있어야 해서 자기 컨테이너다.
  analyze:
    <<: *cron
    command: ["supercronic", "/srv/cosmai/stack/crontab.d/analyze"]
    environment:
      # `<<:` 가 environment: 를 통째로 갈아 끼우므로 앵커의 다섯 키를 여기서 다시 적는다 --
      # collector-commerce 가 이미 밟은 함정이고, 하나를 빠뜨리면 08:00 에야 드러난다.
      COSMAI_DB_HOST: postgres
      COSMAI_DB_PORT: "5432"
      COSMAI_SECRET_FILE: /run/cosmai/env
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      # 08:00 줄의 gemma4 가 부르는 호스트 ollama (#32). secret 이 아니라 주소 노브라 값이 여기 있다
      # (stack/env.example, contracts/secrets.md 의 "secret 이 아닌 것"). 기본값은 컨테이너 안에서
      # 왕복을 실측한 유일한 경로다: WSL2 미러링이 물려받은 Windows 의 Tailscale 인터페이스 --
      # 브리지 게이트웨이(172.18.0.1)도 LAN(192.168.10.35)도 host.docker.internal 도 닿지 않았다.
      # **Tailscale 이 꺼지면 이 주소는 사라진다** -- 그때는 stack/.env 에서 갈아 끼운다. 못 닿는
      # 밤은 조용히 0건이 아니라 failed run 이다 (analysis/polarity/ollama.py 의 preflight).
      OLLAMA_URL: ${OLLAMA_URL:-http://100.102.193.98:11434}

  # --- 노출 ---------------------------------------------------------------------------------------
  # 백엔드도 DB 자격증명도 없다: 브라우저가 PostgREST(3000)를 직접 부르므로
  # 이 컨테이너는 정적 파일만 내보낸다(portal/Dockerfile 자신의 주석).
  portal:
    build: ../portal
    image: cosmai-portal
    restart: unless-stopped
    # 정적 파일만 내보내지만 그것이 부르는 API 뒤에 이 DB 가 있다 -- 스케줄러와 같은 순서로 뜬다.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # PostgREST 와 같은 노출 범위(로컬 네트워크) — 보여주는 것은 그 API 가
      # 이미 anon 에 연 데이터뿐이라 새로운 노출을 만들지 않는다.
      - "${NEEDS_PORTAL_PORT:-3003}:80"
    networks:
      - db-net

volumes:
  # 이름 있는 볼륨: 호스트 배치를 이 파일이 정하지 않는다. 안에 있는 것은 재취득 가능한 payload 뿐이라
  # 백업 대상이 아니고, artifacts 행과의 짝은 DB 쪽 digest 가 쥔다.
  youtube-payloads:

networks:
  db-net:
    # 접두사 없는 이름. 아직 이 망에 붙어 있는 구 스택 컨테이너들이 이 이름으로 찾고, compose 가
    # 기존 망을 새로 만들지 않고 받아들이는 근거(com.docker.compose.network)도 이 이름이다.
    # external 이 아니다 -- 만들던 프로젝트가 사라졌으므로(#176), external 이면 망이 없는 호스트에서
    # `up` 이 실패하기만 한다. 그 대가로 생기는 `down` 의 위험은 이 파일 머리말에 적혀 있다.
    name: db-net
