# Independent captured Run database and viewing package; never attach it to the main DB network.
name: cosmai-run
services:
  postgres:
    image: postgres:18
    volumes:
      - ${COSMAI_RUN_PG_DATA_DIR:-../../service/docker-run/database-data}:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U platform -d app"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 10s
    restart: unless-stopped
  postgrest:
    image: postgrest/postgrest:latest
    environment:
      PGRST_DB_URI: postgres://postgrest_authenticator:${POSTGREST_AUTH_PASSWORD:?}@postgres:5432/app
      PGRST_DB_SCHEMAS: needs
      PGRST_DB_ANON_ROLE: postgrest_anon
      PGRST_DB_POOL: 5
      PGRST_DB_MAX_ROWS: 1000
      PGRST_OPENAPI_MODE: follow-privileges
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ${COSMAI_RUN_DIR:-../../service/Run}/web
      dockerfile_inline: |
        FROM nginx:alpine
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        COPY site/ /usr/share/nginx/html/
        RUN chmod -R a+rX /usr/share/nginx/html/
        EXPOSE 80
    image: cosmai-run-web:restored
    ports:
      - "${RUN_PORT:-8090}:80"
    depends_on: [postgrest]
    restart: unless-stopped
