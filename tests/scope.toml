# Which verification a change needs (#215). `tool/checks/test --changed <base>` reads this file and
# `tool/change_scope.py` turns it into a class: A runs everything, B runs the mapped tests plus the
# DB-free suite, C runs the format/lint/lang checks and the tests below.
#
# `full` is the list of paths whose change can break anything: the database, the packaging or the
# gate itself. A change touching one of them is class A no matter how small it looks. `tests/scope.toml`
# is on that list because a wrong entry here is the one error the classifier cannot catch itself.
full = [
    "contracts/ddl/",
    "db/",
    "tests/conftest.py",
    "tests/scope.toml",
    "tool/checks/test",
    "tool/checks/invariants",
    "tool/checks/suite-lock",
    "tool/checks/tested-tree",
    "tool/change_scope.py",
    "tool/invariants.py",
    "pyproject.toml",
    "uv.lock",
    ".githooks/",
]

# What a prose or translation change is verified by: the checks in tool/checks/{format,lint,lang}
# plus these. `cosmai --help` is a byte snapshot, the version strings are the other user-facing text,
# and AGENTS.md has a size ceiling a docs edit is exactly the thing that breaks.
docs = [
    "tests/test_cli_help.py",
    "tests/test_version_strings.py",
    "tests/test_agents_md.py",
]

# Path prefix -> the tests that cover it. The longest matching prefix wins, so `analysis/polarity/`
# beats `analysis/`. A changed path that matches nothing here is class A: an unmapped file is not a
# small change, it is an unmeasured one. A changed `tests/**/test_*.py` needs no entry -- the
# classifier runs the changed test file itself.
